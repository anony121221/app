[package]
name = "radar-app"
version = "0.1.1"
description = "NEXRAD Level III Radar Viewer"
authors = []
edition = "2021"

[lib]
name = "radar_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "radar-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
base64 = "0.22"
httpdate = "1"
