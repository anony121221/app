<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warning Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06070a;
      --line: #1d2431;
      --text: #eef3ff;
      --muted: #98a2b3;
      --warn: #f4b740;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #131a25 0%, #080a0e 42%, #050608 100%);
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .dashboard-shell {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0));
    }

    .dashboard-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 11, 16, 0.92);
      backdrop-filter: blur(6px);
    }

    .dashboard-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f4f7ff;
    }

    .dashboard-count {
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .dashboard-status {
      min-height: 34px;
      display: flex;
      align-items: center;
      padding: 8px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      background: rgba(9, 12, 17, 0.74);
    }

    .warning-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .warning-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0));
    }

    .warning-main {
      min-width: 0;
    }

    .warning-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .warning-title {
      font-size: 15px;
      font-weight: 700;
      color: #f3f6ff;
      line-height: 1.2;
    }

    .warning-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(244, 183, 64, 0.35);
      color: var(--warn);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .warning-area {
      margin-top: 3px;
      color: #c5cfdf;
      font-size: 12px;
      line-height: 1.3;
    }

    .warning-times {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .warning-go {
      align-self: center;
      min-width: 76px;
      height: 32px;
      padding: 0 12px;
      border: 1px solid #3767ba;
      border-radius: 6px;
      background: linear-gradient(180deg, #13294b, #0d1c34);
      color: #d9e7ff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .warning-go:hover {
      border-color: #4f91ff;
      background: linear-gradient(180deg, #173566, #102545);
      color: #ffffff;
    }

    .warning-empty {
      display: none;
      padding: 18px 16px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="dashboard-shell">
    <div class="dashboard-header">
      <div class="dashboard-title">Active Warnings</div>
      <div class="dashboard-count" id="dashboard-count">0 warnings</div>
    </div>
    <div class="dashboard-status" id="dashboard-status">Opening dashboard...</div>
    <ul class="warning-list" id="warning-list"></ul>
    <div class="warning-empty" id="warning-empty">No active warnings.</div>
  </div>

  <script>
    (() => {
      const CHANNEL_NAME = 'radar-warning-dashboard';
      const STORAGE_KEY = 'radar_warning_dashboard_bus';
      const SOURCE = 'dashboard';
      const TYPE_SNAPSHOT = 'snapshot';
      const TYPE_REQUEST_SNAPSHOT = 'request_snapshot';
      const TYPE_GO_TO_WARNING = 'go_to_warning';
      const SEEN_LIMIT = 256;

      const countEl = document.getElementById('dashboard-count');
      const statusEl = document.getElementById('dashboard-status');
      const listEl = document.getElementById('warning-list');
      const emptyEl = document.getElementById('warning-empty');

      const seenIds = new Set();
      let channel = null;
      let warnings = [];
      let generatedAtMs = NaN;

      function rememberMessage(id) {
        const key = String(id || '').trim();
        if (!key) return false;
        if (seenIds.has(key)) return true;
        seenIds.add(key);
        if (seenIds.size > SEEN_LIMIT) {
          const first = seenIds.values().next().value;
          if (first) seenIds.delete(first);
        }
        return false;
      }

      function parseMs(value) {
        const ms = Date.parse(String(value || ''));
        return Number.isFinite(ms) ? ms : NaN;
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatAbsolute(value) {
        const ms = parseMs(value);
        if (!Number.isFinite(ms)) return '--';
        return new Date(ms).toLocaleString([], {
          month: 'short',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
        });
      }

      function formatRelativeMs(ms) {
        if (!Number.isFinite(ms)) return '--';
        const diffMin = Math.round((Date.now() - ms) / 60000);
        if (Math.abs(diffMin) < 1) return 'now';
        if (Math.abs(diffMin) < 60) return `${Math.abs(diffMin)}m ${diffMin >= 0 ? 'ago' : 'from now'}`;
        const diffHour = Math.round(diffMin / 60);
        if (Math.abs(diffHour) < 24) return `${Math.abs(diffHour)}h ${diffHour >= 0 ? 'ago' : 'from now'}`;
        const diffDay = Math.round(diffHour / 24);
        return `${Math.abs(diffDay)}d ${diffDay >= 0 ? 'ago' : 'from now'}`;
      }

      function updateStatusText(extra) {
        if (!statusEl) return;
        if (extra) {
          statusEl.textContent = extra;
          return;
        }
        if (!Number.isFinite(generatedAtMs)) {
          statusEl.textContent = 'Waiting for warning feed from main app...';
          return;
        }
        statusEl.textContent = `Updated ${formatRelativeMs(generatedAtMs)}`;
      }

      function renderWarnings() {
        if (!countEl || !listEl || !emptyEl) return;
        countEl.textContent = `${warnings.length} warning${warnings.length === 1 ? '' : 's'}`;
        listEl.innerHTML = '';
        emptyEl.style.display = warnings.length ? 'none' : 'block';

        for (const row of warnings) {
          const li = document.createElement('li');
          li.className = 'warning-item';
          li.innerHTML = `
            <div class="warning-main">
              <div class="warning-title-row">
                <div class="warning-title">${escapeHtml(row.event || 'Warning')}</div>
                <div class="warning-tag">Active</div>
              </div>
              <div class="warning-area">${escapeHtml(row.area || 'Area not listed')}</div>
              <div class="warning-times">
                <span>Issued: ${escapeHtml(formatAbsolute(row.sent))}</span>
                <span>Expires: ${escapeHtml(formatAbsolute(row.expires))}</span>
                ${row.nearestStation ? `<span>Nearest Radar: ${escapeHtml(row.nearestStation)}</span>` : ''}
              </div>
            </div>
            <button class="warning-go" type="button" data-warning-id="${escapeHtml(row.id)}">Go To</button>
          `;
          listEl.appendChild(li);
        }
      }

      function applySnapshot(payload) {
        const rows = Array.isArray(payload?.warnings) ? payload.warnings : [];
        warnings = rows
          .filter(row => row && row.id)
          .sort((a, b) => {
            const aMs = Number(a.issuedMs || parseMs(a.sent) || 0);
            const bMs = Number(b.issuedMs || parseMs(b.sent) || 0);
            if (bMs !== aMs) return bMs - aMs;
            return Number(b.expiresMs || parseMs(b.expires) || 0) - Number(a.expiresMs || parseMs(a.expires) || 0);
          });
        generatedAtMs = parseMs(payload?.generatedAt);
        renderWarnings();
        updateStatusText();
      }

      function sendMessage(type, payload) {
        const message = {
          id: `dashboard-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`,
          source: SOURCE,
          type,
          payload: payload || null,
          sentAt: new Date().toISOString(),
        };
        try { channel?.postMessage(message); } catch (_) {}
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(message)); } catch (_) {}
      }

      function handleMessage(message) {
        if (!message || typeof message !== 'object') return;
        if (message.source === SOURCE) return;
        if (rememberMessage(message.id)) return;

        if (message.type === TYPE_SNAPSHOT) {
          applySnapshot(message.payload || {});
        }
      }

      if (typeof BroadcastChannel === 'function') {
        try {
          channel = new BroadcastChannel(CHANNEL_NAME);
          channel.addEventListener('message', evt => {
            handleMessage(evt?.data);
          });
        } catch (_) {
          channel = null;
        }
      }

      window.addEventListener('storage', evt => {
        if (evt.key !== STORAGE_KEY || !evt.newValue) return;
        try {
          handleMessage(JSON.parse(evt.newValue));
        } catch (_) {}
      });

      listEl?.addEventListener('click', evt => {
        const button = evt.target?.closest?.('.warning-go');
        if (!button) return;
        const id = String(button.dataset.warningId || '').trim();
        if (!id) return;
        sendMessage(TYPE_GO_TO_WARNING, { id });
      });

      window.addEventListener('focus', () => {
        sendMessage(TYPE_REQUEST_SNAPSHOT, { reason: 'focus' });
      });

      window.addEventListener('error', evt => {
        const message = String(evt?.message || 'Dashboard script error');
        updateStatusText(message);
      });

      setInterval(() => {
        updateStatusText();
      }, 15000);

      renderWarnings();
      updateStatusText('Connecting to main app...');
      sendMessage(TYPE_REQUEST_SNAPSHOT, { reason: 'startup' });
    })();
  </script>
</body>
</html>
